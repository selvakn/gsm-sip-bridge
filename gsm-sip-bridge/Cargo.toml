[package]
name = "gsm-sip-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gsm-sip-bridge"
path = "src/main.rs"

[[bin]]
name = "gsm-echo"
path = "src/bin/gsm_echo.rs"

[[bin]]
name = "sip-echo"
path = "src/bin/sip_echo.rs"

[features]
pjsip-linked = ["pjsua-safe/pjsip-linked"]
amr-linked = ["amr-safe/amr-linked"]

[dependencies]
pjsua-safe = { path = "../pjsua-safe" }
amr-safe = { path = "../amr-safe" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
prometheus = "0.13"
crossbeam-queue = "0.3"
alsa = "0.9"
libc = "0.2"
crossbeam-channel = "0.5"
rusb = { version = "0.9", features = ["vendored"] }
serialport = "4"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
thiserror = "2"
serde_json = "1"
cron = "0.17"
rand = "0.9"
md-5 = "0.11"
base64 = "0.23"
socket2 = "0.6"
pcsc = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt", "macros"] }
insta = "1"
