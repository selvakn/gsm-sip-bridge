# cargo-deny policy (>= 0.16 schema).
#
# The keys this file used to carry — `[advisories] vulnerability`/`notice` and
# `[licenses] unlicensed` — were removed upstream and now *hard-error* rather
# than warn, so `cargo deny check` failed outright for anyone who actually had
# cargo-deny installed. `make lint` only runs it `if command -v cargo-deny`,
# which is why that went unnoticed; CI now installs it so the policy is
# genuinely enforced somewhere.
#
# Under the current schema vulnerability / unsound / notice advisories are all
# denied unconditionally — an individual finding is suppressed by adding its
# RUSTSEC id to `ignore` (with a comment saying why), not by lowering a
# severity knob.

[advisories]
yanked = "warn"
ignore = []

# All licenses are denied unless listed here; there is no implicit default.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    # Mozilla's root CA bundle (`webpki-roots`), reached through reqwest's
    # rustls-tls. A *data* license rather than a code one — the crate ships the
    # trust store itself — and permissive with no copyleft or attribution
    # burden. It appeared when the dependency refresh moved webpki-roots to
    # 1.x, which relicensed from MPL-2.0.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
