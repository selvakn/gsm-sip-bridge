name: Publish Docker Image

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    # Two images, two platforms each:
    #   <repo>            — the bridge itself (docker/Dockerfile)
    #   <repo>-internet   — the optional cellular-internet sidecar
    #                       (specs/032-cellular-internet-sidecar). Publishing it
    #                       is what lets a same-card-internet deployment pull it
    #                       rather than clone the repo to build a 20MB image.
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        image: [bridge, internet]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: bridge
            dockerfile: docker/Dockerfile
            suffix: ""
          - image: internet
            dockerfile: docker/cellular-internet/Dockerfile
            suffix: "-internet"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}

      - name: Platform pair slug
        id: platform
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push single-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:${{ github.ref_name }}-${{ steps.platform.outputs.slug }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.image }}-${{ steps.platform.outputs.slug }}
          cache-to: type=gha,scope=build-${{ matrix.image }}-${{ steps.platform.outputs.slug }},mode=max

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - suffix: ""
          - suffix: "-internet"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create multi-arch manifest
        run: |
          TAGS=(${{ steps.meta.outputs.tags }})
          SOURCE_AMD64="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:${{ github.ref_name }}-linux-amd64"
          SOURCE_ARM64="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:${{ github.ref_name }}-linux-arm64"

          for TAG in "${TAGS[@]}"; do
            docker buildx imagetools create -t "$TAG" "$SOURCE_AMD64" "$SOURCE_ARM64"
          done

  release:
    # Split out of `merge` so the release is created exactly once, not once per
    # image in the merge matrix.
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute version without v prefix
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -f RELEASE_NOTES.md ]; then
            SECTION=$(awk "found && /^## v/{exit} /^## v${TAG}\$/{found=1; next} found{print}" RELEASE_NOTES.md)
            if [ -n "$SECTION" ]; then
              {
                echo 'NOTES<<RELEASE_EOF'
                echo '## What'\''s New'
                echo "$SECTION"
                echo 'RELEASE_EOF'
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo 'NOTES<<RELEASE_EOF'
                echo '## What'\''s New'
                echo ''
                echo "See [Full Changelog](https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}) for details."
                echo ''
                echo 'RELEASE_EOF'
              } >> "$GITHUB_OUTPUT"
            fi
          else
            {
              echo 'NOTES<<RELEASE_EOF'
              echo '## What'\''s New'
              echo ''
              echo "See [Full Changelog](https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}) for details."
              echo ''
              echo 'RELEASE_EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ${{ steps.release_notes.outputs.NOTES }}
            ## Docker Images

            The bridge:

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.tag }}
            ```

            Optional cellular-internet sidecar — only for deployments whose
            internet comes from the same cellular card that carries calls
            (see docs/ec20-internet-plus-vowifi.md):

            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-internet:${{ steps.ver.outputs.tag }}
            ```

            **Platforms:** linux/amd64, linux/arm64
