name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: [main]

env:
  PJSIP_VERSION: "2.16"
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libasound2-dev libssl-dev libusb-1.0-0-dev libudev-dev uuid-dev socat wget \
            libpcsclite-dev

      - name: Install Rust toolchain
        # Same reasoning, and `stable` is a *branch* — it moves on every
        # toolchain release. Pinning the action does not pin the toolchain:
        # it still resolves stable Rust at run time.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      # `make lint` runs cargo-deny only `if command -v cargo-deny`, and
      # `make test` prefers cargo-nextest when present. Installing both here is
      # what makes the dependency policy and the per-test timeout actually
      # enforced somewhere rather than silently skipped on every machine.
      - name: Install cargo-deny and cargo-nextest
        # Pinned to a commit, not the movable `v2` tag: this is a third-party
        # action running with access to the checkout and to the Cargo/PJSIP
        # caches the later steps persist, so repointing the tag would change
        # what executes here without any change to this repository
        # (Greptile P2). Bump deliberately.
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-deny,cargo-nextest

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache PJSIP build
        id: pjsip-cache
        uses: actions/cache@v4
        with:
          path: ~/pjsip
          key: pjsip-${{ env.PJSIP_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/pjsip-config-site.h') }}

      - name: Build and install PJSIP
        if: steps.pjsip-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/pjsip/pjproject/archive/refs/tags/${PJSIP_VERSION}.tar.gz
          tar xzf ${PJSIP_VERSION}.tar.gz
          cd pjproject-${PJSIP_VERSION}
          cp ../docker/pjsip-config-site.h pjlib/include/pj/config_site.h
          ./configure --prefix=$HOME/pjsip \
            --enable-shared \
            --disable-video \
            --disable-v4l2 \
            --with-external-pa=no
          make -j$(nproc) dep
          make -j$(nproc)
          make install

      - name: Export PJSIP pkg-config and linker paths
        run: |
          echo "PKG_CONFIG_PATH=$HOME/pjsip/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/pjsip/lib" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Check unsafe blocks have SAFETY comments
        run: |
          violations=$(grep -rn "^\s*unsafe\b" pjsua-safe/src/ 2>/dev/null \
            | grep -v "// SAFETY:" \
            | grep -v "#\[cfg" \
            | grep -v "cfg(feature" || true)
          if [ -n "$violations" ]; then
            echo "::error::unsafe blocks without // SAFETY: comment found:"
            echo "$violations"
            exit 1
          fi

      - name: Verify Docker build context
        run: |
          if ! docker compose -f docker/docker-compose.yml config --quiet 2>/dev/null; then
            echo "::warning::docker-compose.yml validation skipped (docker compose not available)"
          fi
