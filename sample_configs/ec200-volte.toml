# ============================================================================
# Sample: EC200(U), host-side VoLTE bridge
# ============================================================================
# The bridge runs its OWN IMS registration over the EC200(U)'s LTE IMS PDN
# and answers incoming calls directly, instead of delegating to the modem's
# internal VoLTE stack. See docs/ec20-volte-setup.md and
# docs/operations.md#host-side-ims-over-lte-volte (specs/015-volte-host-ims,
# 016-volte-calls, 017-volte-inbound-bridge).
#
# WARNING: never enable [volte] alongside [vowifi] on the SAME SIM — both
# register the same IMPU with the same IMEI-derived +sip.instance, so the
# network treats the second registration as replacing the first.

[sip]
server = "pbx.example.com"
username = "gsm-bridge"
password = "env:SIP_PASSWORD"

[volte]
enabled = true
# Without this, the registration is held open but nothing answers on it —
# the modem-internal VoLTE path stays in control of incoming calls. Setting
# it makes this modem EXCLUSIVE to this path: the circuit-switched daemon
# will not drive it, so it has no CS fallback whenever this path is down.
bridge_inbound = true
# Defaults to "home-domain" — TS 24.229 §5.1.1.2's mandated form, confirmed
# working on Jio (required) and Vodafone (verified harmless). Set "pcscf" for
# a deployment that needs the old literal-address form instead (see
# docs/operations.md#register-request-uri-form).
# register_request_uri = "pcscf"
# Jio ignores responses not sent on the Gm client leg; without this an
# inbound call never connects on the caller's side. Defaults to true, since
# every carrier tested so far tolerates it. Set false for one proven to need
# the normal RFC 3261 behaviour instead.
# respond_on_client = false

# Optional: pin to a known modem. Omit [[volte.line]] entirely for
# auto-discovery (cid 3, apn "ims", P-CSCF auto-discovered).
[[volte.line]]
modem_port = "/dev/ttyUSB0"
