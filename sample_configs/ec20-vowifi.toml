# ============================================================================
# Sample: single EC20, VoWiFi (Wi-Fi Calling) bridge
# ============================================================================
# One Quectel EC20 modem registering Wi-Fi Calling over an ePDG/IPsec tunnel
# and bridging inbound IMS calls to the PBX. See docs/vowifi-bridge.md
# (specs/011-vowifi-sip-bridge, 012-strongswan-epdg).

[sip]
server = "pbx.example.com"
username = "gsm-bridge"
password = "env:SIP_PASSWORD"

[vowifi]
enabled = true

# Pin the line to a known modem. An EC20 has USB audio, so the circuit-switched
# path would otherwise reserve it and auto-discovery would skip it for VoWiFi
# (it only auto-selects audio-less modems while [cs] is enabled) — pin it.
# mcc/mnc/IMSI are still derived from the SIM.
# Pinned by USB serial number, which survives a replug; a /dev/ttyUSBn number is
# assigned by enumeration order and can silently change. Find yours with
#   udevadm info -q property -n /dev/ttyUSB2 | grep ID_SERIAL_SHORT
# (modem_port = "/dev/ttyUSB2" also works, but only until the next re-enumeration).
[[vowifi.line]]
modem_serial = "abc123def456"
