# strongswan.d/charon/p-cscf.conf — the osmocom fork's P-CSCF plugin
# requests the carrier's P-CSCF address(es) via the IKE config-payload
# attribute (CPRQ ... PCSCF4/PCSCF6), which is what makes the fork usable
# for ePDG/VoWiFi at all (upstream strongSwan has no such request).
#
# THIS FILE IS OVERWRITTEN AT STARTUP by `supervise::render`'s
# `render_pcscf_plugin_conf`, which lists every resolved line's connection.
# It is shipped only so a charon started by hand outside the supervisor still
# has a valid, loadable plugin config.
#
# The `enable` block is keyed by *connection name*, and connections are named
# per line (ims0, ims1, ...) so that one shared charon can serve them all
# without --initiate/--terminate hitting every line at once. A fixed name here
# therefore matches nothing at runtime, and the failure is silent: charon just
# omits PCSCF4/PCSCF6 from its CPRQ, the carrier never sends a P-CSCF, and
# every line loops establishing a tunnel it then tears down for lacking one.
p-cscf {
    load = yes

    enable {
        ims0 = yes
    }
}
