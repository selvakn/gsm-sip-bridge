# One image, up to three optional subsystems (see docker/entrypoint.sh):
#   1. the circuit-switched GSM-to-SIP daemon — always attempted, no-ops
#      gracefully with no supported modem attached
#   2. the inbound VoWiFi-to-SIP bridge (specs/011-vowifi-sip-bridge) — an
#      ePDG tunnel + vowifi-ims-agent/vowifi-sip-agent, started only when
#      [vowifi].enabled = true in the mounted config.toml. The tunnel
#      engine is chosen via [vowifi].tunnel_engine in that same config.toml
#      (specs/012-strongswan-epdg): "strongswan" (the default) has proper
#      IKE rekeying/re-auth/DPD/MOBIKE and a network namespace that
#      survives reconnects, live-verified against Airtel India; "swu" is
#      the original SWu-IKEv2 Python dialer, kept as an explicit fallback
#      (the 24h soak and the Vi-carrier EAP-AKA check are still outstanding
#      — see specs/012-strongswan-epdg/tasks.md). Switching to "swu" needs the
#      full image: build it here with `INCLUDE_SWU=true docker compose build`
#      (the build arg wired into the service below), or pull the `-swu` tag. The
#      default slim image built below ships strongswan only and fails fast if
#      configured for "swu" (specs/033). .env holds secrets only (see
#      .env.example) — all other configuration, VoWiFi included, lives in
#      config.toml.
#
#   3. the host-side LTE IMS bridge (specs/015/017/018-volte-*), started when
#      [volte].enabled + bridge_inbound = true. Every SIM-ready modem
#      auto-discovered becomes its own line, each in its own network
#      namespace and veth pair (specs/020-volte-line-netns) —
#      the same netns/veth isolation VoWiFi's lines already get above, on a
#      distinct namespace/veth-address base so the two subsystems never
#      collide when both run in this one container. VoWiFi and VoLTE are
#      mutually exclusive on the same SIM (both would re-register the same
#      IMPU) but not with each other otherwise.
#
# `privileged: true` + host networking + full /dev,/sys mounts are needed
# for the circuit-switched daemon's arbitrary-USB-modem hot-plug discovery,
# and happen to be a strict superset of everything the VoWiFi tunnel and the
# VoLTE bridge's per-line namespaces need too (NET_ADMIN/NET_RAW/SYS_ADMIN,
# /dev/net/tun, netns/veth setup for the swu engine; NET_ADMIN/SYS_ADMIN,
# netns/XFRM-interface setup for the strongswan engine; NET_ADMIN/SYS_ADMIN,
# netns/veth setup for VoLTE lines) — no separate capability profile required
# for any subsystem or engine.
services:
  gsm-sip-bridge:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
      # specs/033: slim by default; set INCLUDE_SWU=true in the environment to
      # build the full image (with the SWu/Python engine) via compose. This is
      # what makes the "--build-arg INCLUDE_SWU=true" note above reachable here.
      args:
        INCLUDE_SWU: ${INCLUDE_SWU:-false}
    network_mode: host
    restart: unless-stopped
    privileged: true
    # tini as PID 1 reaps orphaned zombie processes (supervise deliberately doesn't).
    init: true
    # specs/041-shutdown-resource-cleanup: a graceful stop now waits for every
    # child, terminates each line's IKE_SA, flushes this deployment's XFRM
    # state and explicitly deletes each line's tunnel/veth devices before
    # deleting its namespace — releasing the tunnel identifier a leftover
    # interface would otherwise hold hostage against the next restart (see
    # docs/operations.md). That takes longer than Docker's 10s default.
    #
    # Must stay STRICTLY GREATER than supervise::shutdown::STOP_ALLOWANCE
    # (60s), not equal to it — the teardown budgets its own work against
    # STOP_ALLOWANCE, so granting exactly that much leaves zero room for
    # process startup, the final report, and container exit, and Docker
    # would force-kill a teardown that was still inside its own budget.
    # A contract test pins the relationship (research.md R8).
    stop_grace_period: 90s
    volumes:
      - bridge-data:/data
      # Root-level config.toml is canonical (config.toml.example documents
      # it; same file `cargo run -- --config config.toml` uses locally).
      # Override with CONFIG_HOST_PATH for an alternate config.
      - "${CONFIG_HOST_PATH:-../config.toml}:/etc/gsm-sip-bridge/config.toml:ro"
      # specs/041-shutdown-resource-cleanup US2/FR-013: `ip netns add` binds
      # a line's namespace into THIS container's own mount namespace by
      # default, so it disappears with the container if that container is
      # force-killed rather than stopped — leaving the next run (or an
      # operator) with no name to address it by at all. Sharing this
      # directory with the host, propagation `rshared`, keeps every
      # namespace this or any prior run created visible and removable with
      # plain `ip netns` on the host, and is what lets startup reclaim a
      # killed run's leftovers instead of waiting on the kernel (research.md
      # R6). NOT load-bearing for the graceful-stop path above — only for
      # recovering from an *ungraceful* one; if this mount cannot be made
      # to propagate on a given host, only that recovery path is lost.
      - /var/run/netns:/var/run/netns:rshared
      - /dev:/dev
      - /sys:/sys:ro
    env_file:
      - .env
    group_add:
      - audio
      - dialout
    healthcheck:
      test: ["CMD", "/usr/local/bin/gsm-sip-bridge", "--config", "/etc/gsm-sip-bridge/config.toml", "healthcheck"]
      interval: 30s
      timeout: 5s
      # Sized for how long a carrier takes, not this process — a line is only
      # healthy once its ePDG tunnel is up and has been assigned a P-CSCF.
      # Measured on two lines: up in 30-60s, one churning ~2min before
      # settling, so the old 15s declared unhealthy at 105s, mid-startup.
      # Keep in step with the Dockerfile's HEALTHCHECK, which documents this
      # in full; whichever is more specific wins at runtime.
      start_period: 180s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      gsm-sip-bridge:
        condition: service_healthy
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=:9090'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SERVER_HTTP_PORT=3000

  sqlite-web:
    image: coleifer/sqlite-web:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      gsm-sip-bridge:
        condition: service_healthy
    volumes:
      - bridge-data:/data:ro
    command: ["sqlite_web", "--read-only", "--host", "0.0.0.0", "--port", "8088", "/data/store.db"]

volumes:
  bridge-data:
  prometheus-data:
  grafana-data:
